name: Build
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip project
        run: unzip -q BoxPVPAbilities.zip -d proj
      - name: Build
        run: mvn -B -f proj/BoxPVPAbilities/pom.xml clean package
      - uses: actions/upload-artifact@v4
        with:
          name: BoxPVPAbilities-jar
          path: proj/BoxPVPAbilities/target/BoxPVPAbilities.jar
